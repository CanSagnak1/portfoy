<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0a0512" />
  <title>Berfin 🌸</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0a0512; overflow: hidden; -webkit-tap-highlight-color: transparent; }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; touch-action: none; }

    /* Başlangıç ekranı */
    #start {
      position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1.2rem; cursor: pointer;
      background: radial-gradient(ellipse at center, rgba(10, 5, 18, .25), rgba(10, 5, 18, .85));
      border: 0; color: #ffe6f3; font-family: 'Great Vibes', 'Snell Roundhand', cursive;
      transition: opacity 1.4s ease, visibility 1.4s;
    }
    #start .for { font-size: clamp(2rem, 7vw, 3.4rem); text-shadow: 0 0 24px rgba(255, 120, 190, .8); }
    #start .tap {
      font-family: system-ui, -apple-system, sans-serif; font-size: .85rem; letter-spacing: .3em;
      text-transform: uppercase; opacity: .75; animation: pulse 2.2s ease-in-out infinite;
    }
    body.started #start { opacity: 0; visibility: hidden; pointer-events: none; }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: .95; } }

    /* İsim */
    #name {
      position: fixed; left: 0; right: 0; bottom: max(5vh, env(safe-area-inset-bottom));
      text-align: center; pointer-events: none; z-index: 5;
      font-family: 'Great Vibes', 'Snell Roundhand', 'Apple Chancery', cursive;
      font-size: clamp(4rem, 15vw, 9rem); line-height: 1; color: #ffeaf5;
      text-shadow: 0 0 18px rgba(255, 130, 200, .9), 0 0 48px rgba(255, 80, 170, .55), 0 0 90px rgba(190, 80, 255, .4);
    }
    #name span { display: inline-block; opacity: 0; filter: blur(14px); transform: translateY(18px) scale(.9);
      transition: opacity 1.6s ease, filter 1.6s ease, transform 1.6s cubic-bezier(.2, .8, .2, 1); }
    body.show-name #name span { opacity: 1; filter: blur(0); transform: none; }

    /* İpucu */
    #hint {
      position: fixed; top: max(3vh, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; z-index: 5;
      font-family: system-ui, -apple-system, sans-serif; font-size: .8rem; letter-spacing: .2em; text-transform: uppercase;
      color: rgba(255, 230, 245, .7); opacity: 0; transition: opacity 1.2s; pointer-events: none;
    }
    body.show-hint #hint { opacity: 1; }

    /* Ses butonu */
    #mute {
      position: fixed; top: max(14px, env(safe-area-inset-top)); right: 14px; z-index: 11; width: 42px; height: 42px;
      border-radius: 50%; border: 1px solid rgba(255, 200, 230, .35); background: rgba(20, 8, 30, .45);
      color: #ffe6f3; font-size: 18px; cursor: pointer; backdrop-filter: blur(6px); opacity: 0; visibility: hidden;
      transition: opacity 1s 1s;
    }
    body.started #mute { opacity: 1; visibility: visible; }
    #mute.off { opacity: .5 !important; text-decoration: line-through; }

    body.nogl::after {
      content: 'Berfin 🌸'; position: fixed; inset: 0; display: grid; place-items: center; color: #ffe6f3;
      font-family: 'Great Vibes', cursive; font-size: 5rem; background: #0a0512; z-index: 99;
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "./surprise/vendor/three.module.min.js", "three/addons/": "./surprise/vendor/jsm/" } }
  </script>
</head>

<body>
  <div id="stage"></div>
  <button id="start" aria-label="Başla">
    <div class="for">Berfin için…</div>
    <div class="tap">Dokun</div>
  </button>
  <div id="name" aria-label="Berfin"><span>B</span><span style="transition-delay:.18s">e</span><span style="transition-delay:.36s">r</span><span style="transition-delay:.54s">f</span><span style="transition-delay:.72s">i</span><span style="transition-delay:.9s">n</span></div>
  <div id="hint">Sürükle ve çiçeğe dokun</div>
  <button id="mute" aria-label="Sesi kapat">♪</button>
  <script type="module" src="./surprise/flower.js"></script>
</body>

</html>
